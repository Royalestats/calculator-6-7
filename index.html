<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <main class="calc" role="application" aria-label="Калькулятор">
      <header class="calc__head">
        <h1>Калькулятор</h1>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" title="Переключить тему">
          <span class="theme-toggle__icon" id="themeIcon">🌙</span>
        </button>
      </header>

      <div class="history" id="history" aria-live="polite"></div>

      <div class="display">
        <div class="display__expr" id="expr">&nbsp;</div>
        <output class="display__value" id="value">0</output>
      </div>

      <div class="keys" id="keys">
        <button class="key key--fn" data-action="clear" type="button">AC</button>
        <button class="key key--fn" data-action="sign" type="button">±</button>
        <button class="key key--fn" data-action="percent" type="button">%</button>
        <button class="key key--op" data-op="/" type="button">÷</button>

        <button class="key" data-num="7" type="button">7</button>
        <button class="key" data-num="8" type="button">8</button>
        <button class="key" data-num="9" type="button">9</button>
        <button class="key key--op" data-op="*" type="button">×</button>

        <button class="key" data-num="4" type="button">4</button>
        <button class="key" data-num="5" type="button">5</button>
        <button class="key" data-num="6" type="button">6</button>
        <button class="key key--op" data-op="-" type="button">−</button>

        <button class="key" data-num="1" type="button">1</button>
        <button class="key" data-num="2" type="button">2</button>
        <button class="key" data-num="3" type="button">3</button>
        <button class="key key--op" data-op="+" type="button">+</button>

        <button class="key key--wide" data-num="0" type="button">0</button>
        <button class="key" data-action="dot" type="button">.</button>
        <button class="key key--eq" data-action="equals" type="button">=</button>

        <button class="key key--seq" data-seq="67" type="button">67</button>
      </div>

      <audio id="sfx" src="assets/67-gazan_0sRfU15.mp3" preload="auto"></audio>
    </main>
  </div>

  <!-- Красные глаза на лице из гифки. Внутренний блок повторяет математику
       background-size: cover, поэтому координаты совпадают с картинкой
       при любом соотношении сторон экрана. -->
  <div class="eyes" id="eyes" aria-hidden="true">
    <div class="eyes__fit">
      <span class="eyes__eye eyes__eye--l"></span>
      <span class="eyes__eye eyes__eye--r"></span>
    </div>
  </div>

  <!-- Летающие 6 и 7: пары в противофазе -->
  <div class="flyers" id="flyers" aria-hidden="true"></div>

  <!-- Окно оплаты: появляется после 5 нажатий на клавиши -->
  <div class="modal" id="payModal" role="dialog" aria-modal="true" aria-labelledby="payTitle" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="document">
      <button class="modal__x" type="button" data-close aria-label="Закрыть">&times;</button>

      <p class="modal__eyebrow">6-7 Premium</p>
      <h2 class="modal__title" id="payTitle">Калькулятор 6-7</h2>
      <p class="modal__lead">Вы нажали клавиши 5&nbsp;раз. Полная версия умеет считать
        быстрее, чем вы успеваете нажимать.</p>

      <div class="modal__price">
        <span class="modal__amount">67&nbsp;₽</span>
        <span class="modal__period">разово</span>
      </div>

      <ul class="modal__list">
        <li>Безлимитные вычисления 6&nbsp;и&nbsp;7</li>
        <li>Звук GAZAN без ограничений</li>
        <li>Красные глаза во весь экран</li>
      </ul>

      <button class="modal__pay" type="button" id="payBtn">Оплатить 67 ₽</button>
      <button class="modal__later" type="button" data-close>Позже</button>
      <p class="modal__note">Демо-окно: платёж не производится, карта не нужна.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
